<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เข้าสู่ระบบ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="text-align:center;padding-top:120px;font-family:sans-serif;">

<h2>เข้าสู่ระบบ</h2>

<input
  id="idCard"
  type="text"
  maxlength="13"
  placeholder="กรอกเลขบัตรประชาชน 13 หลัก"
  style="font-size:16px;padding:10px;width:260px;"
/>

<br><br>

<button onclick="loginWithLine()"
  style="font-size:18px;padding:14px 26px;">
  🔐 Login with LINE
</button>

<script>
const LINE_CHANNEL_ID = "2008686694";
const GAS_URL =
  "https://script.google.com/macros/s/AKfycbyGZ-a_H7JZXtks0W3-cwCw2VuP05ODQntTQTzzfKFH4GwNCz2rRDBTSgCjssi7bU-I/exec";

function loginWithLine() {
  const idCard = document.getElementById("idCard").value.trim();

  // ❌ validation
  if (!idCard || idCard.length !== 13 || isNaN(idCard)) {
    alert("กรุณากรอกเลขบัตรประชาชนให้ครบ 13 หลัก");
    return;
  }

  const url =
    "https://access.line.me/oauth2/v2.1/authorize" +
    "?response_type=code" +
    "&client_id=" + LINE_CHANNEL_ID +
    "&redirect_uri=" + encodeURIComponent(GAS_URL) +
    "&scope=profile" +
    "&state=" + idCard;   // 🔥 ส่งเลขบัตรไปใน state

  location.href = url;
}
</script>

</body>
</html>
